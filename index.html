<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loddo City 3D - Miami Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff4fa3; --cyan: #22e1ff; --mint: #7cffb2;
    --glass: rgba(26, 18, 60, .72); --line: rgba(255, 255, 255, .16);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: Poppins, system-ui, sans-serif; background: #f6d5c3; color: #fff; }
  canvas { display: block; }

  #topbar { position: fixed; top: 12px; left: 14px; display: flex; align-items: center; gap: 16px; pointer-events: none; }
  .logo { font-family: Pacifico, "Brush Script MT", cursive; font-size: 32px; line-height: 1; color: #fff;
    text-shadow: 0 0 4px var(--pink), 0 0 14px var(--pink), 0 0 28px rgba(255, 79, 163, .6), 0 3px 0 #b8136a; }
  .sub { font-size: 11px; letter-spacing: .38em; text-transform: uppercase; font-weight: 700; margin-top: 6px;
    color: #fff; text-shadow: 0 0 6px var(--cyan), 0 0 14px var(--cyan); }
  .card { background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 26px rgba(20, 10, 50, .28); }
  #wallet { padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: 17px; color: var(--mint); }
  #job { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  #near { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); padding: 9px 18px; border-radius: 999px;
    font-size: 15px; font-weight: 600; pointer-events: none; border-color: rgba(34, 225, 255, .5);
    box-shadow: 0 0 18px rgba(34, 225, 255, .35); }
  #near:empty { display: none; }
  #near b { color: var(--cyan); }
  #minimap { position: fixed; top: 12px; right: 12px; width: 133px; height: 180px; border-radius: 14px;
    border: 2px solid rgba(255, 255, 255, .9); box-shadow: 0 6px 22px rgba(20, 10, 50, .35); }

  #bottomleft { position: fixed; bottom: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; max-width: 330px; }
  #log { padding: 10px 14px; font-size: 14px; line-height: 1.4; border-left: 3px solid var(--pink); }
  #friends { padding: 10px 14px; font-size: 14px; }
  #friends h3 { margin: 0 0 4px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); }
  #flist { list-style: none; padding: 0; margin: 0; }
  #flist li { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; gap: 8px; }
  #flist .hearts { color: var(--pink); }
  #flist button { padding: 4px 12px; border: none; border-radius: 999px; background: linear-gradient(90deg, var(--pink), #ff8a5c);
    color: #fff; font: 600 12px Poppins, sans-serif; cursor: pointer; }
  #help { position: fixed; bottom: 12px; right: 12px; padding: 8px 14px; font-size: 12px; line-height: 1.6; }
  #help kbd { background: rgba(255, 255, 255, .16); border-radius: 5px; padding: 1px 6px; font-family: inherit; font-weight: 600; }

  .label { position: absolute; transform: translate(-50%, -100%); background: var(--glass); color: #fff;
    padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; pointer-events: none; white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, .28); box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }

  .box { position: fixed; padding: 18px; }
  #panel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 340px; max-width: 90vw; }
  #dialog { bottom: 20px; left: 50%; transform: translateX(-50%); width: 540px; max-width: 94vw; }
  #panel h2, #dialog h2 { margin: 0 0 6px; font-family: Pacifico, cursive; font-weight: 400; font-size: 24px;
    color: #fff; text-shadow: 0 0 10px var(--pink); }
  #dsay { font-size: 16px; line-height: 1.5; margin: 6px 0 12px; min-height: 40px; }
  .box p { margin: 6px 0 12px; line-height: 1.45; color: rgba(255, 255, 255, .88); }
  .box button { display: block; width: 100%; margin: 7px 0; padding: 11px 14px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, var(--pink), #ff8a5c); color: #fff; font: 600 15px Poppins, sans-serif;
    cursor: pointer; text-align: left; transition: transform .08s, filter .15s; }
  .box button:hover { filter: brightness(1.1); transform: translateX(3px); }
  .box button:disabled { background: rgba(255, 255, 255, .18); color: rgba(255, 255, 255, .6); cursor: not-allowed; transform: none; }
  .box button.close { background: rgba(255, 255, 255, .14); text-align: center; }
  .hidden { display: none !important; }

  @media (max-width: 760px) {
    #help { display: none; }
    .logo { font-size: 24px; }
    #minimap { width: 100px; height: 135px; }
    #near { top: auto; bottom: 200px; }
  }
</style>
</head>
<body>

<div id="topbar">
  <div><div class="logo">Loddo City</div><div class="sub">Miami Beach</div></div>
  <div id="wallet" class="card">$150</div>
  <div id="job" class="card">Disoccupato</div>
</div>
<div id="near" class="card"></div>
<canvas id="minimap"></canvas>

<div id="bottomleft">
  <div id="log" class="card">Benvenuto a Miami Beach! Cammina verso un edificio o una persona e premi E.</div>
  <div id="friends" class="card"><h3>Amici</h3><ul id="flist"></ul></div>
</div>
<div id="help" class="card"><kbd>WASD</kbd>/<kbd>Frecce</kbd> muovi · <kbd>Shift</kbd> corri · Trascina: ruota · Rotella: zoom · <kbd>E</kbd> usa · <kbd>Esc</kbd> chiudi</div>

<div id="panel" class="box card hidden">
  <h2 id="ptitle"></h2>
  <p id="pdesc"></p>
  <div id="pactions"></div>
  <button class="close" id="closePanel">Chiudi</button>
</div>

<div id="dialog" class="box card hidden">
  <h2 id="dname"></h2>
  <div id="dsay"></div>
  <div id="dopts"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= STATO =================
const state = { money: 150, hasHome: false, job: null };
let paused = false;
let dialogOpen = false;

const usd = n => "$" + n;
function updateWallet() {
  document.getElementById("wallet").textContent = "💵 " + usd(state.money);
  document.getElementById("job").textContent = state.job ? "💼 " + state.job : "Disoccupato";
}
function log(text) { document.getElementById("log").textContent = text; }
function spend(amount) {
  if (state.money < amount) { log("Non hai abbastanza soldi! Serve lavorare."); return false; }
  state.money -= amount; updateWallet(); return true;
}
function earn(amount, text) { state.money += amount; updateWallet(); log(text); }
function work() {
  if (!state.job) { log("Non hai ancora un lavoro. Vai all'Ufficio lavoro su Collins Avenue."); return; }
  const pay = state.job === "Commesso" ? 50 : 80;
  earn(pay, `Hai lavorato come ${state.job}: +${usd(pay)}.`);
}
function flight(city, cost) {
  if (!state.hasHome) { log("Prima trova una casa!"); return; }
  if (spend(cost)) log(`Sei volato a ${city}! (Per ora è solo una scena.)`);
}

// ================= RENDERER, CIELO, LUCI =================
const TAU = Math.PI * 2;
const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xf6d5c3);
scene.fog = new THREE.Fog(HORIZON, 170, 780);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.3, 3600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(HORIZON);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

// Sole del mattino sopra l'oceano (est = +x)
const SUN_DIR = new THREE.Vector3(0.62, 0.55, -0.42).normalize();
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0xf0d2b0, 0.62));
const sun = new THREE.DirectionalLight(0xfff0d8, 0.95);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 460 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    top: { value: new THREE.Color(0x2a6fdb) }, mid: { value: new THREE.Color(0x8cc4f2) },
    horizon: { value: HORIZON.clone() }, sunCol: { value: new THREE.Color(0xfff0c0) }, sunDir: { value: SUN_DIR }
  },
  vertexShader: `varying vec3 vDir;
    void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 horizon; uniform vec3 sunCol; uniform vec3 sunDir;
    varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 base = mix(mid, top, smoothstep(0.05, 0.65, h));
      vec3 col = mix(horizon, base, smoothstep(-0.03, 0.22, h));
      float s = max(dot(d, sunDir), 0.0);
      col += sunCol * (pow(s, 900.0) * 2.0 + pow(s, 40.0) * 0.25 + pow(s, 6.0) * 0.12);
      gl_FragColor = vec4(col, 1.0);
    }`
}));
sky.renderOrder = -1; sky.frustumCulled = false; sky.userData.noShadow = true;
scene.add(sky);

// ================= UTILITÀ =================
let seed = 20261121;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
const rr = (a, b) => a + rnd() * (b - a);
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const hex = c => "#" + c.toString(16).padStart(6, "0");
function shade(c, f) {
  const ch = s => Math.min(255, ((c >> s) & 255) * f) | 0;
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

const matCache = {};
function M(c, o) {
  const k = c + (o ? JSON.stringify(o) : "");
  return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0 }, o)));
}
function Glow(c) { const k = "glow" + c; return matCache[k] || (matCache[k] = new THREE.MeshBasicMaterial({ color: c })); }
const GLASS_DARK = M(0x1f3d4d, { roughness: 0.15 });
const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function add(geo, mat, x, y, z, parent) {
  const m = new THREE.Mesh(geo, typeof mat === "number" ? M(mat) : mat);
  m.position.set(x, y, z);
  (parent || scene).add(m);
  return m;
}
const m4 = (x, y, z, rx = 0, ry = 0, rz = 0, s = 1) => new THREE.Matrix4().compose(
  new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, "YXZ")), new THREE.Vector3(s, s, s));

function mergeGeos(parts) {
  const geos = parts.map(([geo, mat]) => { const g = geo.index ? geo.toNonIndexed() : geo.clone(); g.applyMatrix4(mat); return g; });
  const total = geos.reduce((n, g) => n + g.attributes.position.array.length, 0);
  const pos = new Float32Array(total);
  let o = 0;
  geos.forEach(g => { pos.set(g.attributes.position.array, o); o += g.attributes.position.array.length; });
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  out.computeVertexNormals(); // non indicizzata = normali piatte, stile low-poly
  return out;
}
function instanced(geo, mat, mats, colors) {
  const im = new THREE.InstancedMesh(geo, mat, mats.length);
  mats.forEach((m, i) => { im.setMatrixAt(i, m); if (colors) im.setColorAt(i, new THREE.Color(colors[i])); });
  im.frustumCulled = false;
  scene.add(im);
  return im;
}

// ---- Texture procedurali ----
function makeCanvas(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return c; }
function texFrom(canvas, rx, ry) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = MAX_ANISO;
  return t;
}
function noise(g, w, h, n, alpha) {
  for (let i = 0; i < n; i++) {
    const v = rnd() < 0.5 ? 0 : 255;
    g.fillStyle = `rgba(${v},${v},${v},${rnd() * alpha})`;
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
  }
}
const canvasCache = {};
function facadeCanvas(style, a, b, c) {
  const key = [style, a, b, c].join("_");
  if (canvasCache[key]) return canvasCache[key];
  return canvasCache[key] = makeCanvas(128, 128, g => {
    if (style === "deco") { // a = muro, b = vetro, c = cornici
      g.fillStyle = hex(a); g.fillRect(0, 0, 128, 128);
      noise(g, 128, 128, 300, 0.05);
      g.fillStyle = hex(c); g.fillRect(0, 0, 128, 9);               // "eyebrow" art déco
      g.fillStyle = "rgba(0,0,0,.16)"; g.fillRect(0, 9, 128, 6);
      g.fillStyle = hex(c); g.fillRect(20, 28, 88, 72);
      const gr = g.createLinearGradient(0, 32, 0, 96);
      gr.addColorStop(0, shade(b, 1.45)); gr.addColorStop(1, hex(b));
      g.fillStyle = gr; g.fillRect(24, 32, 80, 64);
      g.fillStyle = hex(c); g.fillRect(62, 32, 4, 64); g.fillRect(24, 58, 80, 3);
      g.fillStyle = "rgba(255,255,255,.22)";
      g.beginPath(); g.moveTo(30, 96); g.lineTo(50, 32); g.lineTo(60, 32); g.lineTo(40, 96); g.fill();
      g.fillStyle = "rgba(0,0,0,.12)"; g.fillRect(18, 100, 92, 6);
    } else { // vetro: a = vetro, b = telaio
      g.fillStyle = hex(b); g.fillRect(0, 0, 128, 128);
      const gr = g.createLinearGradient(0, 0, 0, 112);
      gr.addColorStop(0, shade(a, 1.4)); gr.addColorStop(1, shade(a, 0.8));
      g.fillStyle = gr; g.fillRect(3, 3, 58, 106); g.fillRect(67, 3, 58, 106);
      g.fillStyle = "rgba(255,255,255,.2)"; g.fillRect(3, 3, 58, 12); g.fillRect(67, 3, 58, 12);
      g.fillStyle = shade(b, 1.1); g.fillRect(0, 112, 128, 16);
    }
  });
}
const facadeMatCache = {};
function facadeMat(style, a, b, c, rx, ry) {
  const k = [style, a, b, c, rx, ry].join("_");
  return facadeMatCache[k] || (facadeMatCache[k] = new THREE.MeshStandardMaterial({
    map: texFrom(facadeCanvas(style, a, b, c), rx, ry), roughness: style === "glass" ? 0.3 : 0.85, metalness: 0 }));
}
function facadeBox(w, h, d, style, a, b, c, roof) {
  const ry = Math.max(1, Math.round(h / 3.5)), rf = Math.max(1, Math.round(w / 4)), rs = Math.max(1, Math.round(d / 4));
  const side = facadeMat(style, a, b, c, rs, ry), front = facadeMat(style, a, b, c, rf, ry), top = M(roof);
  return new THREE.Mesh(B(w, h, d), [side, side, top, top, front, front]);
}
function awningMat(col, w) {
  const k = "awn" + col + "_" + Math.round(w);
  if (!facadeMatCache[k]) {
    const cv = makeCanvas(64, 8, g => { g.fillStyle = "#fff"; g.fillRect(0, 0, 64, 8); g.fillStyle = hex(col); g.fillRect(0, 0, 32, 8); });
    facadeMatCache[k] = new THREE.MeshStandardMaterial({ map: texFrom(cv, Math.max(2, Math.round(w / 1.2)), 1), roughness: 0.9 });
  }
  return facadeMatCache[k];
}

// ---- Insegne al neon (testo su canvas) ----
const signDrawers = [];
function neonSign(text, color, width) {
  const cv = document.createElement("canvas"); cv.width = 1024; cv.height = 256;
  const tex = new THREE.CanvasTexture(cv); tex.anisotropy = MAX_ANISO;
  const css = hex(color);
  const draw = () => {
    const g = cv.getContext("2d");
    g.clearRect(0, 0, 1024, 256);
    const font = s => `${s}px Pacifico, "Brush Script MT", cursive`;
    let size = 140; g.font = font(size);
    while (g.measureText(text).width > 920 && size > 40) { size -= 6; g.font = font(size); }
    g.textAlign = "center"; g.textBaseline = "middle";
    g.shadowColor = css; g.shadowBlur = 40; g.fillStyle = css;
    g.fillText(text, 512, 124); g.fillText(text, 512, 124);
    g.shadowBlur = 8; g.fillStyle = "#fff"; g.globalAlpha = 0.92; g.fillText(text, 512, 124); g.globalAlpha = 1;
    tex.needsUpdate = true;
  };
  draw(); signDrawers.push(draw);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, width / 4), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  mesh.userData.noShadow = true;
  return mesh;
}
function roofSign(g, text, neon, width, y, z) {
  const h = width / 4;
  add(B(width + 0.4, h + 0.2, 0.25), 0x241d4d, 0, y + h / 2, z, g);
  for (const sx of [-width * 0.35, width * 0.35]) add(B(0.18, 0.8, 0.18), 0x444444, sx, y - 0.3, z, g);
  const s = neonSign(text, neon, width);
  s.position.set(0, y + h / 2, z + 0.14); g.add(s);
}
if (document.fonts && document.fonts.load) document.fonts.load("80px Pacifico").then(() => signDrawers.forEach(f => f())).catch(() => {});

// ================= MAPPA: SOUTH BEACH =================
// Est (+x) = oceano. Nord = -z. Strade nord-sud: Washington Ave, Collins Ave, Ocean Drive.
const ROADS_NS = [{ x: -90, name: "Washington Ave" }, { x: -10, name: "Collins Ave" }, { x: 60, name: "Ocean Drive" }];
const ROADS_EW = [-180, -90, 0, 90, 180];
const BLOCKS = [[-245, -185], [-175, -95], [-85, -5], [5, 85], [95, 175], [185, 245]];
const STRIPS = {
  ocean:    { front: 47,   face: 1 },   // lato ovest di Ocean Drive, guarda il mare
  collinsE: { front: 3,    face: -1 },
  collinsW: { front: -23,  face: 1 },
  washE:    { front: -77,  face: -1 },
  washW:    { front: -103, face: 1 }
};
const WALLS = [0xffc8dd, 0xbde0fe, 0xcdf5e5, 0xfff1b8, 0xe2d4ff, 0xffd6a5, 0xfafafa, 0xc8f7f0, 0xffe0ec, 0xffcfb8];
const TRIMS = [0xffffff, 0xffffff, 0xffffff, 0x7fd8d0, 0xff9fbf, 0xffc46b, 0x9fc9ff];
const GLASSES = [0x3f8fa8, 0x4a7fa6, 0x2f6f8f, 0x5aa6b8];
const NEONS = [0xff3cac, 0x22e1ff, 0x7cff6b, 0xffe74c, 0xb388ff, 0xff7a3d];
const HOTELS = ["Flamingo", "Ocean Breeze", "Coral Sands", "Palm Royale", "Neon Tide", "Starlite", "Sunset Deco", "Blue Lagoon",
  "Paradiso", "Seashell", "Moonlight", "Pink Pearl", "Aqua Vista", "Sea Glass", "Mango Bay", "Lido Deco", "Sand Dollar", "Orchid"];

const solids = [];    // rettangoli {x,z,w,d} non attraversabili
const obstacles = []; // cerchi {x,z,r}
const palmSpots = [];
function addPalm(x, z, s) { palmSpots.push({ x, z, s: s || rr(0.85, 1.25), ry: rr(0, TAU) }); obstacles.push({ x, z, r: 0.45 }); }

const places = [
  { id: "casa", name: "Casa (Ocean Drive)", kind: "house", strip: "ocean", z: 40, lw: 22, ld: 16, h: 13,
    wall: 0xbff0e0, trim: 0xffffff, glass: 0x3f8fa8, neon: 0x22e1ff, sign: "Casa Loddo",
    desc: "Un appartamento art déco su Ocean Drive, vista oceano. Serve per dormire e riposarti.",
    actions: () => [{ label: state.hasHome ? "Casa già tua" : "Firma il contratto ($100)", disabled: state.hasHome,
      run: () => { if (spend(100)) { state.hasHome = true; log("Hai una casa a South Beach! Ora è tutta tua."); } } }] },
  { id: "parco", name: "Lummus Park", kind: "park", x: 79, z: 0, w: 22, d: 500, noCollide: true,
    desc: "Il parco sul lungomare, tra palme e spiaggia. Qui incontri gli abitanti: avvicinati a una persona e premi E.",
    actions: () => [{ label: "Passeggia (gratis)", run: () => log("Due passi tra le palme, che bella giornata.") }] },
  { id: "dacosta", name: "Pizzeria Da Costa", kind: "shop", strip: "ocean", z: -50, lw: 18, ld: 14, h: 8, tables: true,
    wall: 0xffc8dd, trim: 0xffffff, glass: 0x4a7fa6, awn: 0xe63946, neon: 0xff4f7b, sign: "Da Costa Pizza",
    desc: "Pizzeria con prezzi accessibili, a due passi dalla spiaggia.",
    actions: () => [{ label: "Mangia una pizza ($10)", run: () => { if (spend(10)) log("Pizza buonissima!"); } }] },
  { id: "elite", name: "Ristorante L'Elite9", kind: "shop", strip: "ocean", z: 130, lw: 20, ld: 14, h: 9, tables: true,
    wall: 0xd8c8ff, trim: 0xffffff, glass: 0x2f6f8f, awn: 0x1d3557, neon: 0xb388ff, sign: "L'Elite9",
    desc: "Ristorante di fascia media: si mangia meglio, ma costa di più.",
    actions: () => [{ label: "Cena al ristorante ($30)", run: () => { if (spend(30)) log("Cena speciale!"); } }] },
  { id: "supermercato", name: "Supermercato", kind: "shop", strip: "collinsW", z: -40, lw: 26, ld: 18, h: 7,
    wall: 0xfff1b8, trim: 0xffffff, glass: 0x3f8fa8, awn: 0x2a9d8f, neon: 0x7cff6b, sign: "Super Market",

// Gruppo orientato sul fronte strada: in locale la facciata guarda +z
function stripGroup(stripName, z, ld) {
  const s = STRIPS[stripName];
  const g = new THREE.Group();
  g.position.set(s.front - s.face * ld / 2, 0, z);
  g.rotation.y = s.face * Math.PI / 2;
  scene.add(g);
  return g;
}

function buildDeco(g, o) {
  const { w, h, d, wall, trim, glass, neon } = o;
  const body = facadeBox(w, h, d, "deco", wall, glass, trim, 0xe9e4dc);
  body.position.y = h / 2; g.add(body);
  add(B(w + 0.6, 0.6, d + 0.6), trim, 0, h + 0.3, 0, g);                 // cornicione
  add(B(w * 0.74, 2.7, 0.12), GLASS_DARK, 0, 1.6, d / 2 + 0.07, g);         // vetrine piano terra
  add(B(w * 0.84, 0.3, 2.3), trim, 0, 3.55, d / 2 + 1.15, g);               // pensilina
  add(B(w * 0.84, 0.1, 0.1), Glow(neon), 0, 3.38, d / 2 + 2.3, g);          // neon sotto la pensilina
  if (h > 8) {                                                               // pinne verticali tipiche art déco
    const fh = h - 1, fx = w * 0.36 * (o.finSide || 1);
    add(B(1.4, fh, 1.1), trim, fx, 4 + fh / 2, d / 2 + 0.55, g);
    add(B(2, 0.5, 1.5), trim, fx, h + 3.25, d / 2 + 0.55, g);
    for (const sx of [-0.35, 0.35]) add(B(0.16, fh - 1.4, 0.08), Glow(neon), fx + sx, 4 + fh / 2, d / 2 + 1.13, g);
  }
  if (o.round) {                                                             // angolo arrotondato con finestre a nastro
    const r = 2.2, cx = -w / 2, cz = d / 2 - r;
    add(new THREE.CylinderGeometry(r, r, h, 20), wall, cx, h / 2, cz, g);
    for (let y = 1.9; y < h - 1; y += 3.5) add(new THREE.CylinderGeometry(r + 0.03, r + 0.03, 1.3, 20), GLASS_DARK, cx, y, cz, g);
    add(new THREE.CylinderGeometry(r + 0.3, r + 0.3, 0.6, 20), trim, cx, h + 0.3, cz, g);
  }
  if (o.balconies) for (let y = 7; y < h - 1; y += 3.5) {
    add(B(w * 0.45, 0.18, 1.4), trim, -w * 0.12, y, d / 2 + 0.7, g);
    add(B(w * 0.45, 0.9, 0.06), M(0xbfe9ff, { roughness: 0.1, transparent: true, opacity: 0.55 }), -w * 0.12, y + 0.55, d / 2 + 1.38, g);
  }
  if (o.sign) roofSign(g, o.sign, neon, Math.min(w * 0.55, 12), h + 1, d / 2 - 1);
}

    const iv = (reserved[sn] || []).find(r => zc < r[1] && zc + lw > r[0]);
    if (iv) { zc = iv[1] + 1; continue; }
    const tower = sn === "washW" || (sn !== "ocean" && rnd() < (sn === "collinsW" ? 0.2 : 0.4));
    const ld = tower ? rr(18, 22) : rr(13, 18);
    const h = tower ? (sn === "washW" ? rr(38, 95) : rr(26, 52)) : (sn === "ocean" ? rr(9, 17) : rr(10, 24));
    const z = zc + lw / 2;

    const signed = (sn === "ocean" || (sn === "collinsE" && rnd() < 0.6)) && hotelIdx < HOTELS.length;
    const sign = signed ? HOTELS[hotelIdx++] : null;
    if (tower) buildTower(g, { w: lw, h, d: ld, glass: pick([0x5fa8d3, 0x6cc1c9, 0x4b8bbe, 0x88b9d6, 0x3e7ca6]),

    else buildDeco(g, { w: lw, h, d: ld, wall: pick(WALLS), trim: pick(TRIMS), glass: pick(GLASSES), neon,

}

const C_FOAM = new THREE.Color(0xeafcff), C_SHALLOW = new THREE.Color(0x3fe0d0), C_MID = new THREE.Color(0x17b3c9), C_DEEP = new THREE.Color(0x0b6fa4);
function oceanColor(x) {
  const d = x - 140, c = new THREE.Color();
  if (d < 6) return c.copy(C_FOAM).lerp(C_SHALLOW, Math.max(0, d) / 6);
  if (d < 45) return c.copy(C_SHALLOW).lerp(C_MID, (d - 6) / 39);
  return c.copy(C_MID).lerp(C_DEEP, Math.min(1, (d - 45) / 120));
}
const oceanMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.22, metalness: 0.05, flatShading: true, transparent: true, opacity: 0.93 });
function oceanPlane(x0, x1, z0, z1, sx, sz) {
  const geo = new THREE.PlaneGeometry(x1 - x0, z1 - z0, sx, sz);
  geo.rotateX(-Math.PI / 2); geo.translate((x0 + x1) / 2, 0, (z0 + z1) / 2);
  const p = geo.attributes.position, col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) oceanColor(p.getX(i)).toArray(col, i * 3);
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const m = new THREE.Mesh(geo, oceanMat); m.userData.noCast = true; m.frustumCulled = false; scene.add(m);
  return m;
}

function blocked(x, z) {
  const r = 0.45;
  if (x < -195 || x > 166 || z < -246 || z > 246) return true;
  for (const s of solids) if (x > s.x - s.w / 2 - r && x < s.x + s.w / 2 + r && z > s.z - s.d / 2 - r && z < s.z + s.d / 2 + r) return true;
  for (const o of obstacles) if (Math.hypot(x - o.x, z - o.z) < o.r + r) return true;
  return false;
}

function distToPlace(pl) {
  const dx = Math.max(Math.abs(player.position.x - pl.x) - pl.w / 2, 0);
  const dz = Math.max(Math.abs(player.position.z - pl.z) - pl.d / 2, 0);
  return Math.hypot(dx, dz);
}
function nearestPlace() {
  let best = null, bd = 3;
  for (const pl of places) { const d = distToPlace(pl); if (d < bd) { bd = d; best = pl; } }
  return best;
}
function nearestNPC() {
  let best = null, bd = 2.5;
  for (const n of npcs) {
    const d = Math.hypot(n.g.position.x - player.position.x, n.g.position.z - player.position.z);
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}
function interact() {
  if (paused) return;
  const n = nearestNPC();
  if (n) { openDialog(n); return; }
  const pl = nearestPlace();
  if (pl) openPanel(pl);
}

  return null;
}

// Ogni nodo riceve la persona con cui si parla e restituisce il testo e le scelte.
// Una scelta restituisce la chiave del nodo successivo, oppure null per chiudere.
const T = {
  greet: n => ({ say: n.p.hello, opts: [
    ["Sono nuovo a Miami Beach", () => "newbie"],
    ["Come va la giornata?", () => "mood"],
    ["Ci vediamo!", () => end(n, 1)]
  ] }),
  newbie: n => ({ say: "Benvenuto! Per lavorare c'è l'Ufficio lavoro su Collins Avenue, e lì vicino trovi anche il Supermercato.", opts: [
    ["Che lavoro mi consigli?", () => "job"],
    ["Grazie, ci vediamo!", () => end(n, 1)]
  ] }),
  job: n => ({ say: "Il commesso è il lavoro più semplice per iniziare. Il cameriere paga di più, ma è più faticoso.", opts: [
    ["Capito, grazie!", () => end(n, 1)]
  ] }),
  mood: n => {
    const opts = [
      ["Vuoi una pizza insieme? ($10)", () => pizza(n)],
      ["Ci vediamo a Lummus Park?", () => { addFr(n, 1); return "park"; }],
      ["Ci vediamo!", () => end(n, 0)]
    ];
    if (n.fr >= 2) opts.unshift(["Esci insieme, ti vengo a prendere!", () => meet(n)]);
    if (n.fr >= 3) opts.splice(1, 0, ["Cena insieme da L'Elite9 ($30)", () => dinner(n)]);
    return { say: n.p.mood, opts };
  },
  park: n => ({ say: "Certo! Ti aspetto al parco, vicino alla spiaggia.", opts: [["A dopo!", () => end(n, 0)]] }),
  thanks: n => ({ say: "Buonissima! Grazie per l'invito!", opts: [["A presto!", () => end(n, 0)]] }),
  broke: n => ({ say: "Mi piacerebbe, ma adesso non ho soldi nemmeno io...", opts: [["Capisco, ci vediamo", () => end(n, 0)]] })
};

function openDialog(n) {
  talking = n;
  dialogOpen = true;
  paused = true;
  dlg.classList.remove("hidden");
  document.getElementById("dname").textContent = n.name + (n.friend ? " ♥" : "");
  showNode(n, "greet");
}
function showNode(n, key) {
  const node = T[key](n);
  document.getElementById("dsay").textContent = node.say;
  const box = document.getElementById("dopts");
  box.innerHTML = "";
  node.opts.forEach(([label, fn]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => {
      const next = fn();
      if (next === null) closeDialog();
      else showNode(n, next);
    };
    box.appendChild(b);
  });
  renderFriends();
}
function closeDialog() {
  dlg.classList.add("hidden");
  dialogOpen = false;
  paused = false;
  talking = null;
}

function renderFriends() {
  const ul = document.getElementById("flist");
  ul.innerHTML = "";
  const amici = npcs.filter(n => n.friend);
  if (amici.length === 0) {
    ul.innerHTML = "<li>Nessun amico ancora. Parla con qualcuno a Lummus Park!</li>";
    return;
  }
  amici.forEach(n => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${n.name} <span class="hearts">${"♥".repeat(Math.ceil(n.fr / 2))}</span></span>`;
    const b = document.createElement("button");
    b.textContent = "Chiama";
    b.onclick = () => { if (!paused) openDialog(n); };
    li.appendChild(b);
    ul.appendChild(li);
  });
}
renderFriends();
updateWallet();

// ================= MINIMAPPA =================
const mm = document.getElementById("minimap"), mctx = mm.getContext("2d");
const MX0 = -200, MZ0 = -250, MS = 0.36, MW = 370 * MS, MH = 500 * MS;
mm.width = MW * 2; mm.height = MH * 2;
const mapX = x => (x - MX0) * MS, mapZ = z => (z - MZ0) * MS;
const mmBase = document.createElement("canvas"); mmBase.width = mm.width; mmBase.height = mm.height;
{
  const g = mmBase.getContext("2d"); g.scale(2, 2);
  const rect = (x0, z0, x1, z1, c) => { g.fillStyle = c; g.fillRect(mapX(x0), mapZ(z0), (x1 - x0) * MS, (z1 - z0) * MS); };
  rect(-200, -250, 170, 250, "#e4ddd1");
  rect(93, -250, 170, 250, "#f3e2b3");
  rect(142, -250, 170, 250, "#2bb3d1");
  rect(68, -250, 90, 250, "#86d36a");
  ROADS_NS.forEach(r => rect(r.x - 6, -250, r.x + 6, 250, "#565a63"));
  ROADS_EW.forEach(z => rect(-200, z - 5, 66, z + 5, "#565a63"));
  solids.forEach(s => rect(s.x - s.w / 2, s.z - s.d / 2, s.x + s.w / 2, s.z + s.d / 2, "#f5b8d3"));
}
const PLACE_ICON = { casa: "🏠", dacosta: "🍕", elite: "🍷", supermercato: "🛒", lavoro: "💼", negozi: "🛍", aeroporto: "✈", parco: "🌴" };
function drawMinimap() {
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.drawImage(mmBase, 0, 0);
  mctx.setTransform(2, 0, 0, 2, 0, 0);
  mctx.font = "9px sans-serif"; mctx.textAlign = "center"; mctx.textBaseline = "middle";
  places.forEach(pl => mctx.fillText(PLACE_ICON[pl.id] || "•", mapX(pl.x), mapZ(pl.id === "parco" ? -10 : pl.z)));
  npcs.forEach(n => { mctx.fillStyle = n.friend ? "#ff4fa3" : "#ffffff"; mctx.beginPath(); mctx.arc(mapX(n.g.position.x), mapZ(n.g.position.z), 1.8, 0, TAU); mctx.fill(); });
  const px = mapX(player.position.x), pz = mapZ(player.position.z), r = player.rotation.y;
  mctx.save(); mctx.translate(px, pz); mctx.rotate(-r);
  mctx.fillStyle = "#22e1ff"; mctx.strokeStyle = "#1b1640"; mctx.lineWidth = 1.2;
  mctx.beginPath(); mctx.moveTo(0, 5); mctx.lineTo(3.6, -3.5); mctx.lineTo(0, -1.8); mctx.lineTo(-3.6, -3.5); mctx.closePath(); mctx.fill(); mctx.stroke();
  mctx.restore();
}

// ================= AGGIORNAMENTO =================
const clock = new THREE.Clock();
const v = new THREE.Vector3();
const camTarget = new THREE.Vector3(), camWanted = new THREE.Vector3();
let elapsed = 0;

function updateNPC(n, dt) {
  n.timer -= dt;
  if (n.timer <= 0) {
    n.tx = rr(NPC_AREA.x0, NPC_AREA.x1);
    n.tz = rr(NPC_AREA.z0, NPC_AREA.z1);
    n.timer = 2 + rnd() * 3;
  }
  if (n === talking) { animateHuman(n.H, false, dt); return; }
  const dx = n.tx - n.g.position.x, dz = n.tz - n.g.position.z;
  const d = Math.hypot(dx, dz);
  n.moving = d > 0.1;
  if (n.moving) {
    const sp = Math.min(1.3 * dt, d);
    n.g.position.x += dx / d * sp;
    n.g.position.z += dz / d * sp;
    n.g.rotation.y = Math.atan2(dx, dz);
  }
  animateHuman(n.H, n.moving, dt);
}

function updateCars(dt) {
  for (const c of cars) {
    const hx = c.axis === "x" ? c.dir : 0, hz = c.axis === "z" ? c.dir : 0;
    const cx = c.axis === "x" ? c.pos : c.lane, cz = c.axis === "z" ? c.pos : c.lane;
    const rx = player.position.x - cx, rz = player.position.z - cz;
    const along = rx * hx + rz * hz, lat = Math.abs(rx * hz - rz * hx);
    let target = c.sp;
    if (along > 0 && along < 10 && lat < 2.6) target = 0;
    for (const o of cars) {
      if (o === c || o.axis !== c.axis || o.lane !== c.lane) continue;
      const gap = (o.pos - c.pos) * c.dir;
      if (gap > 0 && gap < 9) target = 0;
    }
    c.v += (target - c.v) * Math.min(1, dt * 3);
    c.pos += c.dir * c.v * dt;
    if (c.axis === "z") { if (c.pos > 255) c.pos = -255; if (c.pos < -255) c.pos = 255; }
    else { if (c.pos > 50) c.pos = -195; if (c.pos < -195) c.pos = 50; }
    c.g.position.set(c.axis === "x" ? c.pos : c.lane, 0, c.axis === "z" ? c.pos : c.lane);
    c.g.rotation.y = Math.atan2(-hz, hx);
  }
}

function updateWater(t) {
  const surge = Math.sin(t * 0.6) * 0.12;
  for (let i = 0; i < oPos.count; i++) oPos.setY(i, WATER_BASE + surge + waveY(oX[i], oZ[i], t));
  oPos.needsUpdate = true;
  oceanFar.forEach(m => { m.position.y = WATER_BASE + surge; });
  yachts.forEach(y => {
    y.g.position.y = WATER_BASE + surge + waveY(y.g.position.x, y.g.position.z, t) + 0.2;
    y.g.rotation.z = Math.sin(t * 0.9 + y.ph) * 0.04;
    y.g.rotation.x = Math.cos(t * 0.7 + y.ph) * 0.03;
  });
}

function updateLabels() {
  for (const pl of places) {
    const far = Math.hypot(pl.x - player.position.x, pl.z - player.position.z) > 110;
    v.set(pl.x, (pl.top || 3) + 1.5, pl.z).project(camera);
    const sy = (-v.y + 1) / 2 * innerHeight;
    if (far || v.z > 1 || sy < 70) { pl.label.style.display = "none"; continue; }
    pl.label.style.display = "block";
    pl.label.style.left = ((v.x + 1) / 2 * innerWidth) + "px";
    pl.label.style.top = sy + "px";
  }
}

function update(dt) {
  elapsed += dt;
  let moving = false, run = 1;
  if (!paused) {
    const up = (keys.KeyW || keys.ArrowUp) ? 1 : 0;
    const down = (keys.KeyS || keys.ArrowDown) ? 1 : 0;
    const rt = (keys.KeyD || keys.ArrowRight) ? 1 : 0;
    const lf = (keys.KeyA || keys.ArrowLeft) ? 1 : 0;
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);   // avanti rispetto alla visuale
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);    // destra rispetto alla visuale
    let mx = fx * (up - down) + rx * (rt - lf);
    let mz = fz * (up - down) + rz * (rt - lf);
    const len = Math.hypot(mx, mz);
    if (len > 0) {
      mx /= len; mz /= len;
      run = (keys.ShiftLeft || keys.ShiftRight) ? 1.7 : 1;
      const inWater = player.position.x > 142 ? 0.55 : 1;
      const sp = 9 * run * inWater * dt;
      const nx = player.position.x + mx * sp;
      const nz = player.position.z + mz * sp;
      if (!blocked(nx, player.position.z)) player.position.x = nx;
      if (!blocked(player.position.x, nz)) player.position.z = nz;
      player.rotation.y = Math.atan2(mx, mz);
      moving = true;
    }
  }
  player.position.y = groundY(player.position.x);
  animateHuman(P, moving, dt, run);
  npcs.forEach(n => updateNPC(n, dt));
  updateCars(dt);
  updateWater(elapsed);
  clouds.forEach(c => { c.position.z += dt * 2.5; if (c.position.z > 700) c.position.z = -700; });

  camTarget.set(player.position.x, player.position.y + 1.7, player.position.z);
  // la camera si avvicina se un edificio si mette tra lei e il giocatore
  const dx = Math.sin(yaw) * Math.cos(pitch), dy = Math.sin(pitch), dz = Math.cos(yaw) * Math.cos(pitch);
  let d = dist;
  for (let s = 1; s <= dist; s += 0.5) {
    const x = camTarget.x + dx * s, y = camTarget.y + dy * s, z = camTarget.z + dz * s;
    if (solids.some(o => y < o.h && Math.abs(x - o.x) < o.w / 2 + 0.6 && Math.abs(z - o.z) < o.d / 2 + 0.6)) { d = Math.max(2.5, s - 0.8); break; }
  }
  camWanted.set(camTarget.x + dx * d, camTarget.y + dy * d, camTarget.z + dz * d);
  camera.position.lerp(camWanted, 1 - Math.exp(-dt * 10));
  camera.lookAt(camTarget);
  sky.position.copy(camera.position);
  sun.position.copy(player.position).addScaledVector(SUN_DIR, 220);
  sun.target.position.copy(player.position);

  const n = nearestNPC();
  const pl = nearestPlace();
  const near = document.getElementById("near");
  let txt = "";
  if (!paused) {
    if (n) txt = `Premi <b>E</b> per parlare con ${n.name}`;
    else if (pl) txt = `Premi <b>E</b>: ${pl.name}`;
  }
  if (near.innerHTML !== txt) near.innerHTML = txt;

  updateLabels();
  drawMinimap();
}

// posizione iniziale della camera
update(0.016);
camera.position.copy(camWanted);

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
